---
- name: Configure web server
  hosts: web
  become: true
  tasks:
    - name: Install httpd
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Deploy index page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html

    - name: Ensure httpd is enabled and running
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
